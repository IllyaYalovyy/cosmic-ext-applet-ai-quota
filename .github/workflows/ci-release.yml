name: Test and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 scripts/ci-plan.py

  build:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.fedoraproject.org/fedora@sha256:66675eee2c4afe00d0044aafe7b8bf3ae2727ac907dc065f44fb302d025276ed # Fedora 45 x86_64
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Install Fedora build and test tools
        run: >-
          dnf -y install git gcc gcc-c++ curl ca-certificates python3
          pkgconf-pkg-config libxkbcommon-devel wayland-devel fontconfig-devel
          rust cargo clippy rustfmt rpm-build redhat-rpm-config binutils
          tar gzip zstd cpio findutils which ImageMagick dejavu-sans-fonts
          desktop-file-utils appstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        name: Identify Rust toolchain
        run: |
          rustc --version
          echo "key=$(rustc --version | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora45-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Cargo.lock') }}
      - name: Run every offline test and render configuration
        run: ./scripts/ci-test.sh
      - name: Build Fedora 45 RPM
        run: ./scripts/build-release.sh
      - name: Install, verify and remove RPM
        run: ./scripts/ci-rpm-smoke.sh
      - name: Upload tested package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.sha }}
          path: dist/*/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders-${{ matrix.sha }}
          path: target/ci-evidence/**/*.png
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: publish-${{ matrix.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-${{ matrix.sha }}
          path: dist/ci
      - name: Verify and publish tested RPM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ matrix.sha }}
        run: python3 scripts/ci-publish.py dist/ci
